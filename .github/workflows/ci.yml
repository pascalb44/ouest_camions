name: ouestcamions

on: # specify the build to trigger the automated ci/cd
  push:
    branches:
      - "dev"
jobs:
  tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Docker
      uses: hoverkraft-tech/compose-action@v2.0.1
    - name: Sleep for 10 seconds
      run: sleep 10s
      shell: bash
      # Build API et DB pour les tests
      
    - name: Start containers
      run: docker compose -f docker-compose.yml up -d mysql_db laravel-docker
      working-directory: . #test-api # test file
    - name: Wait for MySQL
      run: |
        until docker exec mysql_db mysqladmin ping -h "127.0.0.1" --silent; do
        echo "Waiting for MySQL..."
        sleep 2
        done  

    - name: Debug jest inside test-api
      run: |
          docker compose -f docker-compose.yml run --rm test-api ls -l node_modules/.bin/jest || true
          docker compose -f docker-compose.yml run --rm test-api npx jest --version || true    

    - name: Use testing environment inside container
      run: docker exec laravel-docker cp .env.testing .env

    - name: Database migrate
      run: docker exec laravel-docker php artisan migrate --force
    - name: Database seed
      run: docker exec laravel-docker php artisan db:seed --force
    - name: Install node
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
    - name: Install dependencies
      run: npm install
      working-directory: ./ouest-camions-react
    - name: Run tests
      run: npm run test
      working-directory: ./ouest-camions-react


  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

    # Démarre MySQL + Laravel
      - name: Build and start containers
        run: docker compose -f docker-compose.yml up -d mysql_db laravel-docker

    # Attendre que MySQL soit prêt
      - name: Wait for MySQL
        run: |
          until docker exec mysql_db mysqladmin ping -h "127.0.0.1" --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

    # Préparer Laravel avec le bon .env
      - name: Prepare Laravel (env, cache, migrations, seed)
        run: |
          docker exec laravel-docker cp .env.testing .env
          docker exec laravel-docker php artisan config:clear
          docker exec laravel-docker php artisan config:cache
          docker exec laravel-docker php artisan migrate --force
          docker exec laravel-docker php artisan db:seed --force

    # (Optionnel) vérifier que JWT_SECRET est bien pris en compte
      - name: Check JWT_SECRET
        run: docker exec laravel-docker php artisan tinker --execute="echo env('JWT_SECRET');"

    # Build test-api container
      - name: Build test-api container
        run: docker build -t test-api ./test-api

    # Lancer les tests d'intégration
      - name: Run integration tests
        run: docker compose -f docker-compose.yml run --rm \
          -e BASE_URL=http://laravel-docker:80/api \
          test-api

  build-and-push-image-api-prod:
    needs:
      - tests
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: pascalb44 # user github
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./ouest-camions-api # laravel 
          build-args: |
            "MODE=prod"
          push: true
          tags: |
            ghcr.io/pascalb44/cda-api-prod:latest
            ghcr.io/pascalb44/cda-api-prod:${{ github.sha }}

  build-and-push-image-spa-prod:
    needs:
      - tests
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          # username: pascalb44
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./ouest-camions-react # react
          build-args: |
            "MODE=prod"
          push: true
          tags: |
            ghcr.io/pascalb44/cda-spa-prod:latest
            ghcr.io/pascalb44/cda-spa-prod:${{ github.sha }}
