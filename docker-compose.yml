services:
  laravel-docker:
    container_name: laravel-docker
    build: ./ouest-camions-api # back
    #restart: unless-stopped
    restart: "no"

    ports:
      - 8000:80
    #volumes:
    #  - ./ouest-camions-api/storage:/var/www/app/storage:rw
    depends_on:
      mysql_db:
        condition: service_healthy

  vue-docker:
    container_name: vue-docker
    build: ./ouest-camions-react #front
    ports:
      - 80:80
    restart: unless-stopped

  mysql_db:
    image: mysql:latest
    container_name: mysql_db 
    environment:
      MYSQL_ROOT_PASSWORD: histo44 
      MYSQL_DATABASE: ouest_camions_test # base test
    ports:
      - 3306:3306
    volumes :
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  test-api:
    build: ./test-api  
    #image: node:20
    working_dir: /app
    volumes:
      - ./test-api:/app
      - /app/node_modules 
      #- ./node_modules:/usr/src/app/node_modules
    depends_on:
    - laravel-docker
    environment:
      BASE_URL: http://laravel-docker:80
      JWT_SECRET: At4oMJgeieryAyYyPO2oXA22ZI6sQIlt7KwlSxxwmr1T5cZOn2N1aP6H9YZskLAG
    command: px jest --runInBand # >
      # sh -c "npm ci && npx jest --runInBand"

volumes:
  mysql_data:
